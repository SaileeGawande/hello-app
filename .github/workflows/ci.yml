name: CI/CD practise pipeline

on:
  push:
    branches: [main, practise-ci]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t hello-app .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/saileegawande/hello-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Pull image
        run: docker pull ghrc.io/saileegawande/hello-app:${{ github.sha}}
      
      - name: Run Container
        run: docker run -d -p 3002:3000 --name app ghrc.io/saileegawande/hello-app:${{github.sha}}
      
      - name: Verify it responds
      run:
        sleep 5 
        curl -f htttp://localhost:3002/health
