name: CI practice pipeline

on:
  push:
    branches: [main, practise-ci]
  pull_request:
    branches: [main]

permissions:
  packages: write
  contents: read

jobs:
  build:
  runs-on: Unbutu-latest
  
  steps:
    -uses: actions/checkout@v4

    -uses: actions/setup-node@v4
    with:
      node-version: 20

    -name: Install dependencies
    run: npm install
    -name: Test run
    run: npm test
    -name: Build Docker Image
    run: docker build -t hello-app .

    -name: Login to GHRC
    uses: actions/login-actions@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor}}
      password: ${{ secrets.GITHUB_TOKEN}}

      -name: Build and Push Image in Registry
      -uses: docker/build-push-action@v6
      with:
        context:
          push: true
          tags: ghrc.io/saileegawande/hello-app: ${{ github.sha}}
    