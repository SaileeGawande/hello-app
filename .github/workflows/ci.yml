name: CI/CD practise pipeline

on:
  push:
    branches: [main, practise-ci]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t hello-app .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/saileegawande/hello-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        
      - name: Create db-secret
        run: kubectl create secret generic db-secret --from-literal=password='${{ secrets.DB_PASSWORD }}'
      
      - name: Set image tag
        run: sed -i "s|COMMIT_ID|${{ github.sha }}" k8s/deployment.yaml

      - name: Deploy to cluster
        run:
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/hello-app --timeout=120s

      - name: Smoke test
        run:
          kubectl port-forward svc/hello-app 8081:80 &
          sleep 6
          curl -f http://localhost:8081/health

