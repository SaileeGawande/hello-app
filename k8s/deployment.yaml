apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app

spec:
  replicas: 2
  selector:
    matchLabels:
     app: hello-app
  template:
    metadata:
      labels:
       app: hello-app
    
    spec:
      containers: 
      - name: hello-app
        image: ghcr.io/saileegawande/hello-app:688f238985d6a28054c4a043a19613b5124199a2
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
