apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app

spec:
  replicas: 2
  selector:
    matchLabels:
     app: hello-app
  template:
    metadata:
      labels:
       app: hello-app
    
    spec:
      containers: 
      - name: hello-app
        image: ghcr.io/saileegawande/hello-app:COMMIT_ID
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10 
      
        env:
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
                name: app-config
                key: APP_MESSAGE
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
                name: db-secret
                key: password
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi 